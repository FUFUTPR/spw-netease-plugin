# 构建可复现性：固定 JVM 参数、关闭增量编译。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=false
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx1536m

# JDK 25 由 tools/jdk.ps1 解析（SPW_JDK_HOME → JAVA_HOME → 常见安装位置），
# Gradle toolchain 只从这两个环境变量查找，避免误用机器上的其他 JDK。
org.gradle.java.installations.fromEnv=JAVA_HOME,SPW_JDK_HOME
